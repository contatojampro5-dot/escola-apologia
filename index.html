 {k:"txt",h:"Graça não é prêmio",p:"Quase toda religião diz: “faça o bem e talvez Deus te aceite”. O evangelho diz o contrário: **Deus te aceita em Cristo, e por isso você muda.**"},
 {k:"tf",q:"As boas obras são o preço que pagamos pela salvação.",a:false,e:"As obras são o fruto da salvação, não o preço dela (Ef 2.8-10)."},
 {k:"verse"},
 {k:"quote",t:"O cristianismo, se for falso, não tem importância nenhuma; se for verdadeiro, tem importância infinita. A única coisa que ele não pode ser é moderadamente importante.",by:"C. S. Lewis"},
 {k:"txt",h:"Por que isso te deixa firme",p:"Se sua identidade depende da aprovação da turma, você se cala quando riem da sua fé. Em Cristo, **você não precisa vencer a discussão para estar seguro.**"},
 {k:"chat",who:"Carol",c:"#D6336C",q:"Me explica rapidinho: o que vocês, crentes, acreditam?",o:[
  {t:"Deus criou tudo bom. A gente virou as costas e estragou tudo. Jesus morreu no nosso lugar e ressuscitou, e quem confia nele é perdoado de graça. E um dia ele vai consertar o mundo.",v:2,r:"Nossa, nunca tinha ouvido assim, em ordem. Faz sentido como história.",tip:"Criação, Queda, Redenção e Consumação em quatro frases. Perfeito!"},
  {t:"Ah, é complicado... Vai na igreja comigo que o pastor explica melhor.",v:1,r:"Hmm, deixa pra lá então 😅",tip:"Convidar é ótimo, mas ela pediu pra VOCÊ explicar. Use os 4 atos."},
  {t:"A gente acredita que tem que ser uma pessoa boa pra ir pro céu.",v:0,r:"Ué, então é igual a toda religião?",tip:"Cuidado: isso é o contrário do evangelho. Somos salvos pela graça, não por sermos bons o bastante."}]},
 {k:"mentor",t:"Grave os quatro atos: Criação, Queda, Redenção e Consumação. Esse é o alicerce de tudo que vem depois."}
 ]},

f2:{conf:"dar um motivo racional para crer que Deus existe",
 mis:"Pergunte a um amigo: “Você acha que o universo teve um começo?” Escute a resposta inteira antes de falar.",
 s:[
 {k:"txt",h:"Fé não é pular no escuro",p:"A Bíblia diz que a criação aponta para o Criador (Rm 1.20). Hoje são 3 argumentos que filósofos sérios usam até hoje."},
 {k:"txt",tag:"Argumento 1",h:"Tudo o que começa tem causa",p:"É o argumento cosmológico Kalam, formulado na Idade Média e popularizado hoje pelo filósofo William Lane Craig."},
 {k:"order",h:"Monte o argumento Kalam",items:["Tudo o que começa a existir tem uma causa.","O universo começou a existir.","Logo, o universo tem uma causa."],e:"Duas premissas e uma conclusão. Se as premissas são verdadeiras, a conclusão também é."},
 {k:"txt",h:"O universo teve começo",p:"O modelo do Big Bang indica que tempo, espaço e matéria começaram. E quem propôs essa ideia, em 1927, foi Georges Lemaître: físico **e padre**."},
 {k:"txt",h:"Como é essa causa?",p:"Se tempo, espaço e matéria começaram, a causa está fora deles: **eterna, imaterial, poderosíssima e pessoal**, capaz de escolher criar. Soa familiar?"},
 {k:"txt",tag:"Argumento 2",h:"O ajuste fino",p:"A gravidade e outras constantes da física precisam estar numa faixa estreitíssima para existir vida. Mude um pouquinho e não haveria estrelas, química nem vida."},
 {k:"pick",q:"Quais são as 3 explicações possíveis para o ajuste fino?",o:["Necessidade física, acaso ou design","Evolução, sorte ou destino","Big Bang, caos ou magia"],c:0,e:"Não há evidência de necessidade, e o acaso exige probabilidades absurdas. Design é a melhor explicação."},
 {k:"quote",t:"Uma interpretação de bom senso dos fatos sugere que um superintelecto andou mexendo na física, assim como na química e na biologia.",by:"Fred Hoyle, astrônomo que não era cristão (1981)"},
 {k:"txt",tag:"Argumento 3",h:"O argumento moral",p:"Torturar uma criança por diversão é errado **de verdade**, não só “na minha opinião”. Mas de onde vem esse “de verdade”? Uma lei moral pede um Legislador."},
 {k:"bug",h:"Toque no trecho errado",parts:["O argumento moral diz que,","sem Deus,","os ateus não conseguem ser bons."],w:2,e:"O argumento não fala do comportamento dos ateus (muitos são ótimas pessoas). Ele pergunta o que fundamenta o bem e o mal."},
 {k:"chat",who:"Léo",c:"#1C7ED6",q:"Se tudo precisa de uma causa, quem criou Deus? 🤔",o:[
  {t:"O argumento não diz que tudo precisa de causa, só o que começa a existir. Deus não começou: é eterno.",v:2,r:"Hm... então a questão é o que é eterno: a matéria ou Deus?",tip:"Isso! E a matéria não pode ser eterna se o universo teve começo."},
  {t:"Ninguém sabe, é um mistério.",v:1,r:"Então fica tudo no mesmo nível de mistério...",tip:"Tem resposta, sim: só precisa de causa o que começa a existir."},
  {t:"Não pode perguntar isso, é falta de fé.",v:0,r:"Ué, perguntar é proibido? 😬",tip:"Perguntas são bem-vindas! A fé cristã não tem medo delas."}]},
 {k:"verse"},
 {k:"mentor",t:"Argumento nenhum obriga alguém a crer. Mas tira pedras do caminho para a pessoa olhar para Jesus."}
 ]},

f3:{conf:"responder a quem diz que a Bíblia foi alterada",
 mis:"Mostre para alguém um dos achados desta lição (Tel Dan, Pedra de Pilatos ou Tanque de Siloé) e conte por que ele importa.",
 s:[
 {k:"txt",h:"Telefone sem fio?",p:"“A Bíblia foi alterada como um telefone sem fio.” Você vai ouvir isso. Vamos aos fatos."},
 {k:"big",n:"5.800+",p:"manuscritos gregos do Novo Testamento. A Ilíada, a obra antiga mais bem documentada depois dele, tem cerca de 2 mil."},
 {k:"txt",h:"Muito perto do original",p:"O Papiro P52, um trecho de João 18, é geralmente datado da primeira metade do século II: poucas décadas depois de o Evangelho ser escrito."},
 {k:"txt",h:"Não é uma fila, é uma árvore",p:"No telefone sem fio, cada um só ouve o anterior. Os manuscritos se espalharam em vários ramos independentes (Egito, Síria, Roma...). Comparando as cópias, os erros aparecem."},
 {k:"tf",q:"Alguma doutrina central do cristianismo depende de uma variante duvidosa dos manuscritos.",a:false,e:"A maioria das variantes é ortografia ou ordem de palavras. Nenhuma doutrina central depende de variante duvidosa."},
 {k:"txt",tag:"1947",h:"Os Manuscritos do Mar Morto",p:"Encontraram um rolo completo de Isaías mil anos mais antigo do que as cópias que tínhamos. O resultado: praticamente o mesmo texto."},
 {k:"match",h:"Ligue o achado ao que ele confirmou",pairs:[["Estela de Tel Dan","a “Casa de Davi”"],["Pedra de Pilatos","o nome de Pôncio Pilatos"],["Ossuário de Caifás","o sumo sacerdote do julgamento"],["Tanque de Siloé","o lugar de João 9"]]},
 {k:"txt",h:"Quem escolheu os livros?",p:"A igreja não inventou o cânon: ela **reconheceu** os livros que já eram usados como Escritura. Em 367, Atanásio listou os 27 livros do Novo Testamento que temos hoje."},
 {k:"chat",who:"Duda",c:"#7048E8",q:"A Bíblia foi escrita por homens e alterada mil vezes. Não dá pra confiar.",o:[
  {t:"Foi escrita por homens que Deus inspirou. Alterada? Temos mais de 5.800 manuscritos gregos, de lugares diferentes. Se alguém muda uma cópia, as outras denunciam. Qual trecho você acha que mudou?",v:2,r:"Sei lá, ouvi num vídeo... Nunca tinha pensado nos manuscritos.",tip:"Fatos e uma pergunta no final. A conversa continua!"},
  {t:"Eu creio porque sinto que é verdade.",v:1,r:"Mas eu sinto que não é... e aí?",tip:"Sua experiência importa, mas ela pediu evidência. Use os manuscritos."},
  {t:"Quem fala isso tá enganado pelo diabo, nem vou discutir.",v:0,r:"Nossa, que grosseria. 🙄",tip:"Mansidão (1 Pe 3.15)! Ataque pessoal fecha a porta da conversa."}]},
 {k:"verse"},
 {k:"mentor",t:"Casa bem construída não tem medo de vistoria. A Bíblia também não: pode investigar."}
 ]},

f4:{conf:"mostrar que Jesus existiu e afirmou ser Deus",
 mis:"Leia Marcos 2.1-12 e conte para alguém por que essa cena mostra quem Jesus dizia ser.",
 s:[
 {k:"txt",h:"Jesus existiu?",p:"Praticamente nenhum historiador sério nega. Até o agnóstico Bart Ehrman, crítico do cristianismo, escreveu um livro inteiro mostrando que sim."},
 {k:"match",h:"Ligue o historiador ao que ele registrou",pairs:[["Tácito, romano","Cristo executado sob Pilatos"],["Flávio Josefo, judeu","Tiago, “irmão de Jesus”"],["Plínio, governador","hinos “a Cristo, como a um deus”"]]},
 {k:"txt",h:"O que Jesus disse sobre si",p:"Ele não falou só de amor e de paz. Ele disse coisas que só Deus poderia dizer."},
 {k:"txt",h:"“Antes que Abraão existisse, EU SOU”",p:"Em João 8.58, Jesus usa para si o nome de Deus de Êxodo 3.14. Os ouvintes entenderam: pegaram pedras para apedrejá-lo."},
 {k:"txt",h:"Ele perdoou pecados",p:"Em Marcos 2, Jesus perdoa os pecados de um paralítico. Os escribas reagiram: “Quem pode perdoar pecados, senão um, que é Deus?” Exatamente."},
 {k:"tf",q:"Jesus aceitou ser adorado como Deus.",a:true,e:"Tomé disse “Senhor meu e Deus meu!” (Jo 20.28), e Jesus não o corrigiu."},
 {k:"txt",h:"O trilema",p:"Quem diz o que Jesus disse só pode ser: **mentiroso** (sabia que não era Deus), **lunático** (achava que era, sem ser) ou **Senhor** (é mesmo quem disse ser)."},
 {k:"pick",q:"“Jesus foi só um grande mestre moral.” Por que essa opção não funciona?",o:["Um bom mestre não afirmaria ser Deus se não fosse","Jesus nunca ensinou sobre moral","Ninguém lembra o que ele ensinou"],c:0,e:"Ou ele é mentiroso, ou lunático, ou Senhor. “Só um bom mestre” não está entre as opções."},
 {k:"quote",t:"Não venhamos com essa bobagem condescendente de que ele foi um grande mestre humano. Ele não nos deixou essa opção.",by:"C. S. Lewis, Cristianismo puro e simples"},
 {k:"chat",who:"Gabi",c:"#0CA678",q:"Jesus foi um cara legal, tipo Gandhi. Mas Filho de Deus já é exagero.",o:[
  {t:"Ele foi bom, concordo. Mas um homem só bom não diria que perdoa pecados e que existia antes de Abraão. Ou ele mentia, ou estava fora da realidade, ou é quem disse ser. O que você acha dessas falas dele?",v:2,r:"Nunca tinha reparado que ele falava essas coisas...",tip:"Trilema na prática, terminando com uma pergunta."},
  {t:"Gandhi não ressuscitou, Jesus sim. Fim.",v:1,r:"Tá, mas como você sabe disso?",tip:"A ressurreição é a carta certa, mas chegou cedo. Primeiro mostre o que Jesus afirmou."},
  {t:"Você vai pro inferno falando assim.",v:0,r:"Ok, conversa encerrada. 🙃",tip:"Ameaça não convence, só afasta. Responda com razões e mansidão."}]},
 {k:"txt",h:"E a 4ª opção: lenda?",p:"Críticos dizem que tudo foi inventado depois. No Nível 2 você vai ver por que as fontes são próximas demais dos fatos para isso."},
 {k:"verse"},
 {k:"mentor",t:"Alicerce pronto: o evangelho, Deus, a Bíblia e Jesus. Agora dá para subir as paredes!"}
 ]},

d1:{conf:"explicar a Trindade sem cair em erro",
 mis:"Explique para alguém a frase “um quê e três quem” e peça para a pessoa repetir com as palavras dela.",
 s:[
 {k:"mentor",t:"Oi, eu sou a Pri! Coruja-buraqueira adora cavar fundo. Doutrina é isso: ir além da superfície. Vamos?"},
 {k:"txt",h:"Repare no detalhe",p:"Mateus 28.19: batizando “em **nome** do Pai, e do Filho, e do Espírito Santo”. Um nome, no singular. Três Pessoas."},
 {k:"txt",h:"Em uma frase",p:"Há **um só Deus**, que existe eternamente em **três Pessoas**: Pai, Filho e Espírito Santo. As três são igualmente Deus e não se confundem."},
 {k:"big",n:"1 quê · 3 quem",p:"Um único ser divino (o quê) e três Pessoas (quem). Guarde essa fórmula."},
 {k:"txt",tag:"Erro 1",h:"Modalismo",p:"Uma pessoa só usando três máscaras. Mas no batismo de Jesus o Filho está na água, o Espírito desce e o Pai fala do céu, **ao mesmo tempo** (Mt 3.16-17)."},
 {k:"txt",tag:"Erro 2",h:"Arianismo",p:"O Filho seria a primeira criatura. O Concílio de Niceia (325) respondeu: ele é _homoousios_, da mesma substância do Pai. “O Verbo era Deus” (Jo 1.1)."},
 {k:"txt",tag:"Erro 3",h:"Triteísmo",p:"Três deuses separados. Não: a Bíblia é clara, Deus é um só (Dt 6.4)."},
 {k:"match",h:"Ligue o erro à sua ideia",pairs:[["Modalismo","uma pessoa, três máscaras"],["Arianismo","o Filho seria criatura"],["Triteísmo","três deuses separados"]]},
 {k:"pick",q:"“A Trindade é como a água: gelo, líquido e vapor.” Qual o problema?",o:["Ensina modalismo: a mesma coisa mudando de forma","Divide Deus em três partes","Nenhum, a comparação é perfeita"],c:0,e:"E a do ovo (casca, clara e gema) divide Deus em partes. Melhor admitir: Deus é maior que qualquer comparação."},
 {k:"txt",h:"Por que isso importa?",p:"“Deus é amor” (1 Jo 4.8). Antes de criar qualquer coisa, quem ele amava? Pai, Filho e Espírito se amam desde sempre. Você foi criado para entrar nesse amor."},
 {k:"chat",who:"Caio",c:"#F08C00",q:"Trindade não faz sentido. 1 + 1 + 1 = 3, não 1.",o:[
  {t:"Seria contradição se Deus fosse um e três no mesmo sentido. Mas ele é um em ser e três em pessoas: um quê, três quem. Não é soma.",v:2,r:"Hm, então não é conta de matemática, é sobre quem Deus é.",tip:"Isso! E dá para completar: amor eterno precisa de relação eterna."},
  {t:"É como um ovo: casca, clara e gema.",v:1,r:"Então cada um é um terço de Deus?",tip:"Essa comparação divide Deus em partes. Cada Pessoa é Deus por inteiro."},
  {t:"Tem coisa que não é pra entender, é só pra crer.",v:0,r:"Conveniente, né? 😏",tip:"Deus é maior que nós, mas a doutrina não é contraditória. Mostre a diferença entre ser e pessoa."}]},
 {k:"verse"},
 {k:"mentor",t:"Bateu dúvida? Volte à fórmula: um quê, três quem."}
 ]},

d2:{conf:"defender a ressurreição com fatos históricos",
 mis:"Conte para alguém os fatos mínimos e pergunte: “Qual explicação dá conta de todos eles?”",
 s:[
 {k:"txt",h:"Tudo ou nada",p:"Paulo apostou tudo num fato: “se Cristo não ressuscitou, é vã a vossa fé” (1 Co 15.17). Nenhuma outra religião se arrisca assim. Ou seja: dá para investigar."},
 {k:"txt",h:"O credo mais antigo",p:"Em 1 Coríntios 15.3-7, Paulo repete um credo: Cristo morreu, foi sepultado, ressuscitou e apareceu a Pedro, aos Doze, a mais de 500 pessoas de uma vez e a Tiago."},
 {k:"txt",h:"Cedo demais para ser lenda",p:"Muitos estudiosos, inclusive céticos, datam esse credo de **poucos anos** depois da cruz. Lenda precisa de tempo para crescer, e não houve tempo."},
 {k:"list",h:"Os fatos mínimos",p:"Aceitos pela maioria dos historiadores, crentes ou não (Gary Habermas):",items:["Jesus morreu crucificado","Os discípulos creram tê-lo visto ressuscitado","Paulo, o perseguidor, se converteu","Tiago, o irmão cético, se converteu","O túmulo foi encontrado vazio"]},
 {k:"tf",q:"A data de nascimento de Jesus (25 de dezembro) é um dos fatos mínimos.",a:false,e:"Não é. E a data exata do nascimento nem é conhecida."},
 {k:"match",h:"Ligue a teoria ao motivo de ela falhar",pairs:[["Roubaram o corpo","ninguém morre por mentira que inventou"],["Alucinação","não acontece igual em grupo"],["Jesus só desmaiou","soldados romanos sabiam executar"],["Túmulo errado","bastava mostrar o túmulo certo"]]},
 {k:"txt",h:"Um detalhe que ninguém inventaria",p:"As primeiras testemunhas foram **mulheres**, e naquela cultura o testemunho delas tinha pouco peso. Quem inventasse a história escolheria homens respeitados."},
 {k:"pick",q:"Como se chama esse princípio dos historiadores?",o:["Critério do constrangimento","Critério da maioria","Lei do silêncio"],c:0,e:"Detalhes que atrapalham a história tendem a ser verdadeiros."},
 {k:"chat",who:"Bruno",c:"#E8590C",q:"Ressurreição é impossível. Gente morta não volta.",o:[
  {t:"Por causa natural, não volta mesmo. Mas, se Deus existe, ressuscitar alguém não é impossível. Bora olhar os fatos: morte, túmulo vazio, aparições, Paulo e Tiago. Qual explicação fecha todos?",v:2,r:"Hm... a da alucinação não fecha mesmo.",tip:"Você tirou a conversa do “impossível” e levou para a evidência."},
  {t:"Tá na Bíblia, então aconteceu.",v:1,r:"Mas eu não acredito na Bíblia, mano.",tip:"Use fontes que ele aceita: os fatos mínimos que até céticos reconhecem."},
  {t:"Você só não quer acreditar.",v:0,r:"E você só quer acreditar. Empate. 🤷",tip:"Julgar o motivo da pessoa não responde o argumento dela."}]},
 {k:"verse"},
 {k:"mentor",t:"A ressurreição é a pedra angular. Se ela é verdade, todo o resto ganha peso."}
 ]},

d3:{conf:"explicar a diferença entre justificação e santificação",
 mis:"Escreva Romanos 8.1 num papel e deixe num lugar onde você veja todo dia desta semana.",
 s:[
 {k:"txt",h:"Justificação: o veredito",p:"É um termo de tribunal: Deus **declara justo** o pecador. Não porque ele seja bom, mas porque a justiça de Cristo é creditada na conta dele."},
 {k:"txt",h:"A grande troca",p:"“Aquele que não conheceu pecado, ele o fez pecado por nós; para que, nele, fôssemos feitos justiça de Deus” (2 Co 5.21)."},
 {k:"txt",h:"Santificação: o caminho",p:"A justificação acontece de uma vez. A santificação é ficar parecido com Jesus a vida toda. Você se esforça **porque** Deus age em você (Fp 2.12-13)."},
 {k:"tf",q:"Justificação e santificação são a mesma coisa.",a:false,e:"Justificação é o veredito, de uma vez. Santificação é o processo, a vida inteira."},
 {k:"txt",h:"Paulo contra Tiago?",p:"Paulo: somos salvos pela fé, sem obras (Ef 2.8-9). Tiago: a fé sem obras é morta (Tg 2.17). Contradição? Não."},
 {k:"txt",h:"Raiz e fruto",p:"Paulo fala da **raiz**: o que salva. Tiago fala do **fruto**: como se reconhece a fé verdadeira. A árvore viva dá frutos; os frutos não dão vida à árvore."},
 {k:"bug",h:"Toque no trecho errado",parts:["Somos salvos pela graça,","por meio da fé,","e as boas obras pagam o resto."],w:2,e:"Não há resto a pagar. As obras são fruto de quem já foi salvo (Ef 2.10)."},
 {k:"quote",t:"Graça barata é a graça sem discipulado, a graça sem a cruz, a graça sem Jesus Cristo vivo e encarnado.",by:"Dietrich Bonhoeffer, Discipulado (1937)"},
 {k:"txt",h:"De graça, mas não barata",p:"Bonhoeffer foi executado pelos nazistas em 1945. Ele sabia: a graça é de graça, mas custou a vida do Filho de Deus, e chama você a seguir Jesus com tudo."},
 {k:"chat",who:"Mel",c:"#AE3EC9",q:"Então é só aceitar Jesus e depois fazer o que quiser? 😅",o:[
  {t:"Não. A salvação é de graça, mas quem foi salvo passa a amar quem o salvou, e quem ama muda. É tipo casamento: você não trabalha pra ganhar o “sim”, mas depois do “sim” a vida inteira muda.",v:2,r:"Faz sentido. Não é pra ganhar, é porque já ganhou.",tip:"Perfeito: graça verdadeira, não barata."},
  {t:"Você tem que se esforçar muito pra merecer a salvação.",v:0,r:"Então eu nunca vou conseguir...",tip:"Ninguém merece. A salvação é dom (Ef 2.8-9); o esforço vem depois, como fruto."},
  {t:"Na prática é isso mesmo, só não fala pro pastor.",v:0,r:"Kkkk sério?",tip:"Isso é graça barata! A fé verdadeira dá frutos (Tg 2.17)."}]},
 {k:"txt",h:"Segurança",p:"“Agora, pois, já nenhuma condenação há para os que estão em Cristo Jesus” (Rm 8.1). Quem foi aceito pelo único que importa não vive com medo de rejeição."},
 {k:"verse"},
 {k:"mentor",t:"Raiz e fruto. Quando a dúvida bater, lembre da árvore."}
 ]},

d4:{conf:"contar a história da igreja em poucos marcos",
 mis:"Pergunte a alguém mais velho da sua igreja como a fé chegou à família dele. Anote a história.",
 s:[
 {k:"txt",h:"Quem não conhece a própria história...",p:"...é facilmente convencido de que ela é vergonhosa. Estes marcos te dão chão."},
 {k:"txt",tag:"c. 30–33",h:"Tudo começa",p:"Crucificação e ressurreição de Jesus. No Pentecostes, nasce a igreja."},
 {k:"txt",tag:"64",h:"Perseguição",p:"Nero persegue cristãos em Roma. Pedro e Paulo morrem nessa época. Por quase 300 anos, ser cristão podia custar a vida."},
 {k:"quote",t:"Há oitenta e seis anos eu o sirvo, e ele nunca me fez mal algum. Como posso blasfemar contra o meu Rei, que me salvou?",by:"Policarpo de Esmirna, diante da morte (c. 155)"},
 {k:"txt",tag:"313 a 451",h:"Liberdade e concílios",p:"313: o Edito de Milão encerra a perseguição. 325: Niceia, o Filho é Deus. 381: Constantinopla, o Espírito é Deus. 451: Calcedônia, Jesus é plenamente Deus e plenamente homem."},
 {k:"txt",tag:"31 de outubro de 1517",h:"A Reforma",p:"Martinho Lutero publica as 95 teses. Começa a Reforma Protestante."},
 {k:"order",h:"Coloque na ordem em que aconteceu",items:["Martírio de Policarpo","Concílio de Niceia","Lutero publica as 95 teses","Assembleia de Deus chega ao Brasil"],e:"c. 155, 325, 1517 e 1911."},
 {k:"match",h:"Ligue cada Sola ao seu sentido",pairs:[["Sola Scriptura","a Escritura é a autoridade final"],["Sola Gratia","salvação só pela graça"],["Sola Fide","recebida só pela fé"],["Solus Christus","só por meio de Cristo"],["Soli Deo Gloria","tudo para a glória de Deus"]]},
 {k:"txt",tag:"1910 e 1911",h:"E no Brasil?",p:"Em 1910 chega a Congregação Cristã. Em 1911, a Assembleia de Deus nasce em Belém do Pará, com os missionários Daniel Berg e Gunnar Vingren."},
 {k:"chat",who:"Vini",c:"#2F9E44",q:"O cristianismo só cresceu porque o imperador Constantino obrigou todo mundo.",o:[
  {t:"Na real, ele cresceu quase 300 anos debaixo de perseguição antes de Constantino. Os cristãos cuidavam dos doentes, adotavam bebês abandonados e morriam sem negar a fé.",v:2,r:"Não sabia que foi perseguido tanto tempo.",tip:"História bem contada desmonta o mito."},
  {t:"Constantino era um homem de Deus, então tudo bem.",v:1,r:"Mas então a fé foi imposta mesmo?",tip:"O ponto não é defender Constantino: a igreja já estava em todo o Império antes dele."},
  {t:"Isso é mentira de professor ateu.",v:0,r:"Tá, mas é mentira por quê?",tip:"Mostre os fatos em vez de atacar quem falou."}]},
 {k:"verse"},
 {k:"mentor",t:"Você é o próximo capítulo dessa história."}
 ]},

a1:{conf:"conversar sobre o sofrimento com alguém",
 mis:"Pense em alguém que está sofrendo. Mande uma mensagem só para dizer que você se importa, sem argumentos.",
 s:[
 {k:"mentor",t:"E aí, eu sou o Tito! Tatu-bola tem armadura, e a Bíblia fala da armadura de Deus (Ef 6.11). Aqui a gente treina defesa: com firmeza e mansidão."},
 {k:"txt",h:"A objeção mais forte",p:"E a mais pessoal. Leve a sério. Mas saiba que existem **dois problemas** diferentes aqui: um lógico e um emocional."},
 {k:"txt",tag:"O problema lógico",h:"“Se Deus é bom, por que o mal?”",p:"“Um Deus bom e todo-poderoso não permitiria o mal. O mal existe. Logo, esse Deus não existe.”"},
 {k:"txt",h:"A resposta de Plantinga",p:"O filósofo Alvin Plantinga mostrou que não há contradição: Deus pode ter boas razões para permitir o mal, como criar seres **realmente livres**. Amor forçado não é amor."},
 {k:"txt",h:"O mal aponta para Deus",p:"Para chamar algo de mal, você precisa de um padrão de bem. Sem Deus, o que chamamos de mal vira só a natureza seguindo seu curso."},
 {k:"quote",t:"...nenhum projeto, nenhum propósito, nenhum mal e nenhum bem, nada além de uma indiferença cega e impiedosa.",by:"Richard Dawkins, ateu, descrevendo um universo sem Deus (O rio que saía do Éden, 1995)"},
 {k:"txt",h:"Deus não ficou de longe",p:"O cristianismo é a única fé em que Deus **entra** no sofrimento. Jesus chorou (Jo 11.35), foi traído, torturado e morto. A cruz prova: não é indiferença."},
 {k:"quote",t:"Deus sussurra em nossos prazeres, fala em nossa consciência, mas grita em nossas dores: elas são o seu megafone para despertar um mundo surdo.",by:"C. S. Lewis, O problema do sofrimento (1940)"},
 {k:"pick",q:"Um amigo acabou de perder alguém. O que fazer primeiro?",o:["Explicar a defesa do livre-arbítrio","Dizer que tudo tem um motivo","Estar presente e chorar junto"],c:2,e:"Os amigos de Jó acertaram nos sete dias de silêncio (Jó 2.13) e erraram quando começaram a explicar."},
 {k:"chat",who:"Lari",c:"#E64980",q:"Se Deus existe, por que deixa criança morrer de câncer?",o:[
  {t:"Essa pergunta também me dói, e eu não sei o porquê de cada caso. Mas a gente sente que é errado porque o mundo não deveria ser assim. E Deus não ficou assistindo: entrou na dor, morreu numa cruz e prometeu acabar com a morte.",v:2,r:"Nunca tinha pensado que Deus também sofreu.",tip:"Honestidade e esperança, sem fórmula pronta."},
  {t:"Deus tem um propósito em tudo, confia.",v:1,r:"Fácil falar quando não é com você.",tip:"Pode até ser verdade, mas soa frio. Comece reconhecendo a dor."},
  {t:"Deve ser por causa do pecado da família.",v:0,r:"Que absurdo. 😡",tip:"Jesus rejeitou essa lógica (Jo 9.2-3). Nunca culpe quem sofre."}]},
 {k:"txt",h:"O fim da história",p:"Nem sempre veremos o porquê nesta vida. Mas a história termina com Deus enxugando “dos olhos toda lágrima” (Ap 21.4)."},
 {k:"verse"},
 {k:"mentor",t:"Com quem sofre: presença primeiro, filosofia depois."}
 ]},

a2:{conf:"mostrar que fé e ciência não são inimigas",
 mis:"Pesquise um cientista cristão desta lição (Mendel, Lemaître ou Pascal) e conte uma curiosidade dele para alguém.",
 s:[
 {k:"txt",h:"A ciência nasceu entre cristãos",p:"Kepler, Galileu, Boyle, Pascal, Newton, Faraday e Maxwell eram crentes. Gregor Mendel, o pai da genética, era monge."},
 {k:"txt",h:"E hoje?",p:"Francis Collins, que liderou o Projeto Genoma Humano, é cristão. E a ideia do Big Bang foi proposta por um padre, Georges Lemaître."},
 {k:"txt",h:"Não é coincidência",p:"Eles criam num Deus racional, então esperavam um universo **ordenado e compreensível**. Por isso valia a pena investigar."},
 {k:"tf",q:"Na Idade Média, os estudiosos achavam que a Terra era plana.",a:false,e:"Eles sabiam que a Terra é esférica. O mito se espalhou no século XIX, em parte por uma biografia romanceada de Colombo (1828)."},
 {k:"txt",h:"E o caso Galileu?",p:"Envolveu política, personalidade e a física da época. Houve erro das autoridades da Igreja, mas Galileu morreu crente e via a natureza como um livro escrito por Deus."},
 {k:"txt",h:"O erro do cientificismo",p:"É a ideia de que “só a ciência produz conhecimento verdadeiro”. Mas nenhum experimento prova essa frase. Ela se derruba sozinha."},
 {k:"pick",q:"Por que “só a ciência produz conhecimento” se derruba sozinha?",o:["Porque nenhum experimento consegue provar essa frase","Porque a ciência sempre erra","Porque todo cientista é religioso"],c:0,e:"É uma afirmação filosófica que nega o valor das afirmações filosóficas."},
 {k:"txt",h:"Como e por quê",p:"Explicar como um motor funciona não elimina o engenheiro que o projetou. A ciência explica **como**; a fé responde **por quê**."},
 {k:"match",h:"Ligue o cientista à contribuição",pairs:[["Gregor Mendel","pai da genética"],["Georges Lemaître","propôs o Big Bang"],["Francis Collins","Projeto Genoma Humano"],["Isaac Newton","lei da gravitação universal"]]},
 {k:"chat",who:"Igor",c:"#1098AD",q:"Eu acredito na ciência, não em religião.",o:[
  {t:"Eu também acredito na ciência! Newton, Pascal e Mendel eram cristãos. Mas “só acredito no que a ciência prova”: isso a ciência consegue provar?",v:2,r:"...É, acho que não dá pra provar isso em laboratório.",tip:"Você mostrou que o conflito é falso e que ele também tem uma crença filosófica."},
  {t:"A ciência muda toda hora, a Bíblia não.",v:1,r:"Mudar com evidência nova é bom, ué.",tip:"A ciência não é inimiga. Mostre que ela nasceu de uma visão cristã do mundo."},
  {t:"Ciência é coisa do diabo.",v:0,r:"Aí fica difícil levar sua fé a sério. 🙄",tip:"Isso confirma o mito do conflito! Deus é o autor da natureza que a ciência estuda (Sl 19.1)."}]},
 {k:"txt",h:"E a idade da Terra?",p:"Cristãos fiéis à Bíblia divergem sobre isso. Conheça os lados, mas não faça disso o centro da conversa com quem ainda nem crê em Deus."},
 {k:"verse"},
 {k:"mentor",t:"Quem estuda a criação está lendo a obra do Criador. Pode estudar sem medo."}
 ]},

a3:{conf:"responder a quem diz que cada um tem sua verdade",
 mis:"Use numa conversa desta semana a pergunta: “O que você quer dizer com isso?”",
 s:[
 {k:"txt",h:"A frase que se derruba sozinha",p:"“Não existe verdade absoluta.” Essa frase é absolutamente verdadeira?"},
 {k:"txt",h:"Serrando o galho",p:"Se for verdade absoluta, ela se contradiz. Se não for, por que aceitá-la? O relativismo serra o galho em que está sentado."},
 {k:"txt",h:"Ninguém vive assim",p:"Quem diz “cada um tem sua verdade” não aceita que o banco tenha “a verdade dele” sobre o saldo da sua conta."},
 {k:"pick",q:"Qual destas frases é questão de GOSTO, e não de fato?",o:["Sorvete de flocos é o melhor","Jesus ressuscitou","A Terra gira em torno do Sol"],c:0,e:"Gosto muda de pessoa para pessoa. Fatos, não: ou aconteceram, ou não."},
 {k:"txt",h:"Tolerância de verdade",p:"Tolerar é **suportar aquilo de que você discorda**. Só se tolera o que se acha errado. Discordo de você e, mesmo assim, te respeito."},
 {k:"tf",q:"Ser tolerante é concordar com todas as opiniões.",a:false,e:"Tolerância é respeitar quem discorda de você, não concordar com tudo."},
 {k:"txt",h:"Toda visão exclui alguém",p:"“Todas as religiões levam a Deus” também exclui: deixa de fora budistas, muçulmanos e cristãos, que discordam dessa frase."},
 {k:"txt",h:"Os cegos e o elefante",p:"Na história, cada cego toca uma parte do elefante. Mas quem conta a história diz ver o elefante inteiro: reivindica a visão completa que nega aos outros."},
 {k:"list",h:"As 2 perguntas de Colombo",p:"Greg Koukl ensina a usar perguntas em vez de discursos:",items:["“O que você quer dizer com isso?”","“Como você chegou a essa conclusão?”"]},
 {k:"chat",who:"Nina",c:"#5C7CFA",q:"Isso é verdade pra você, mas não pra mim.",o:[
  {t:"O que você quer dizer com isso? Gosto de sorvete é pessoal. Mas Jesus ter ressuscitado é fato: ou aconteceu, ou não. Se aconteceu, é verdade pra nós dois. Bora investigar?",v:2,r:"Tá, faz sentido separar gosto de fato.",tip:"Pergunta de Colombo e distinção entre gosto e fato. Mandou bem!"},
  {t:"Ok, cada um com a sua.",v:1,r:"Pois é. 👍",tip:"Paz é bom, mas você abriu mão da verdade. Dá para discordar com respeito."},
  {t:"Você tá errada e pronto.",v:0,r:"Nossa, que arrogante.",tip:"Firmeza sem mansidão vira grosseria. Use perguntas."}]},
 {k:"txt",h:"“Que é a verdade?”",p:"Pilatos perguntou isso com desdém (Jo 18.38). A Verdade estava em pé na frente dele."},
 {k:"verse"},
 {k:"mentor",t:"Perguntas tiram a pressão de você. Ninguém precisa saber tudo para conduzir bem uma conversa."}
 ]},

a4:{conf:"explicar de onde vem o certo e o errado",
 mis:"Agradeça a alguém por uma atitude justa ou bondosa que você viu esta semana e diga por que ela importa.",
 s:[
 {k:"txt",h:"Ateu pode ser bom?",p:"Claro que sim! A Bíblia diz que a lei moral está gravada no coração de todos (Rm 2.15). Essa não é a questão."},
 {k:"txt",h:"A pergunta real",p:"**O que faz o bem ser bem?** Sem Deus, de onde vem a obrigação de ser bom?"},
 {k:"match",h:"Se a moral viesse só de...",pairs:[["Evolução","explicaria o que sentimos, não o que é certo"],["Maioria","a escravidão já teria sido certa"],["Gosto pessoal","“não torture” valeria o mesmo que “não gosto de jiló”"]]},
 {k:"tf",q:"Se a moral fosse decidida pela maioria, os abolicionistas estariam errados enquanto a maioria aceitava a escravidão.",a:true,e:"Exatamente, e ninguém aceita essa conclusão. Logo, a moral não depende da maioria."},
 {k:"txt",h:"Nietzsche entendeu",p:"O ateu Friedrich Nietzsche anunciou que “Deus está morto” (1882) e percebeu: a moral cristã não sobreviveria sem o Deus cristão."},
 {k:"txt",h:"O preço",p:"O século XX, com regimes que rejeitaram Deus e mataram dezenas de milhões, mostrou o que acontece quando se corta a raiz."},
 {k:"txt",h:"De onde vêm os direitos humanos",p:"Dignidade igual para todos não é óbvia na história. Ela vem da convicção bíblica de que somos **imagem de Deus**. Tire o Criador e os direitos viram concessão do Estado."},
 {k:"txt",h:"“Homens sem peito”",p:"C. S. Lewis mostrou que povos do mundo todo compartilham uma lei moral comum. E alertou: tratar valores como meros sentimentos forma gente com razão, mas sem coragem moral."},
 {k:"bug",h:"Toque no trecho errado",parts:["Segundo o argumento moral,","sem Deus,","os ateus são pessoas más."],w:2,e:"O argumento não diz isso. Diz que, sem Deus, falta fundamento para o bem e o mal."},
 {k:"chat",who:"Enzo",c:"#3B5BDB",q:"Eu não preciso de Deus para ser uma pessoa boa.",o:[
  {t:"Concordo, você pode ser boa pessoa sem crer em Deus. Minha pergunta é outra: se tudo é matéria e acaso, o que faz a bondade ser obrigatória? Acho que você sente que o bem é real. Eu também.",v:2,r:"Hm... nunca pensei de onde vem esse “obrigatório”.",tip:"Você separou comportamento de fundamento. Esse é o coração do argumento."},
  {t:"A Bíblia manda ser bom, então é por isso.",v:1,r:"Mas eu não sigo a Bíblia e sou bom do mesmo jeito.",tip:"Ele não aceita a Bíblia como autoridade. Pergunte de onde vem o dever moral."},
  {t:"Sem Deus ninguém é bom de verdade, você só finge.",v:0,r:"Valeu pela consideração. 🙄",tip:"Falso e ofensivo. Muitos ateus são gentis; a questão é o fundamento."}]},
 {k:"verse"},
 {k:"mentor",t:"Armadura completa! Agora você responde às objeções mais fortes, sempre com mansidão."}
 ]},

c1:{conf:"enxergar a cosmovisão por trás de uma música ou série",
 mis:"Escolha uma música ou série de que você gosta e responda as 4 perguntas de cosmovisão sobre ela.",
 s:[
 {k:"mentor",t:"Eu sou a Dani, uma harpia! Lá de cima a gente enxerga a floresta inteira. Cosmovisão é isso: ver a vida toda pelas lentes certas."},
 {k:"txt",h:"Todo mundo usa lentes",p:"Cosmovisão é o conjunto de convicções pelas quais você enxerga tudo. Todo mundo tem uma, inclusive quem diz que não tem."},
 {k:"list",h:"4 perguntas revelam qualquer cosmovisão",items:["Origem: de onde viemos?","Sentido: por que estamos aqui?","Moral: como devemos viver?","Destino: para onde vamos?"]},
 {k:"txt",tag:"Concorrente 1",h:"Naturalismo",p:"Só existe matéria. Origem: acaso. Sentido: nenhum, só o que você inventar. Destino: o nada."},
 {k:"txt",tag:"Concorrente 2",h:"Pós-modernismo",p:"Não há verdade, só narrativas e disputas de poder. Toda afirmação de verdade vira tentativa de dominar."},
 {k:"txt",tag:"Concorrente 3",h:"Consumismo",p:"A vida é prazer, imagem e experiência. O sentido vira o próximo produto ou a próxima curtida."},
 {k:"txt",tag:"Concorrente 4",h:"Ideologias que viram religião",p:"Projetos políticos que prometem salvação pelo Estado ou pela revolução, com seus próprios “pecados”, “santos” e “hereges”."},
 {k:"match",h:"Ligue a cosmovisão à frase dela",pairs:[["Naturalismo","“no fim, só existe matéria”"],["Pós-modernismo","“verdade é só narrativa de poder”"],["Consumismo","“você é o que você tem e posta”"]]},
 {k:"txt",h:"A resposta cristã",p:"**Origem:** Deus nos criou. **Sentido:** amar a Deus e ao próximo. **Moral:** refletir o caráter de Deus. **Destino:** ressurreição e nova criação."},
 {k:"quote",t:"Não há um centímetro quadrado em todo o domínio da existência humana sobre o qual Cristo, que é soberano sobre tudo, não clame: “É meu!”",by:"Abraham Kuyper (1880)"},
 {k:"chat",who:"Júlia",c:"#F76707",q:"Eu não tenho cosmovisão nenhuma, só vivo minha vida.",o:[
  {t:"Todo mundo tem, mesmo sem dar nome. Você acha que sua vida tem propósito ou é tudo acaso? Existe certo e errado de verdade? Suas respostas são a sua cosmovisão.",v:2,r:"Nossa... nunca tinha parado pra pensar nisso.",tip:"As 4 perguntas abriram a conversa sem pressão."},
  {t:"Então você é naturalista.",v:1,r:"Sou? Nem sei o que é isso.",tip:"Rótulo fecha a conversa. Pergunta abre."},
  {t:"Quem não tem cosmovisão cristã está perdido.",v:0,r:"Ok, tchau. 😒",tip:"Verdade dita sem sabedoria vira muro. Comece pelas perguntas."}]},
 {k:"verse"},
 {k:"mentor",t:"Agora, toda música, filme e série vai mostrar as lentes que usa. Treine o olhar!"}
 ]},

c2:{conf:"defender o valor de toda vida humana com graça",
 mis:"Descubra uma iniciativa que apoia gestantes, idosos ou pessoas com deficiência perto de você e veja como ajudar.",
 s:[
 {k:"txt",h:"O fundamento",p:"Todo ser humano é criado à imagem de Deus (Gn 1.27). Por isso, tirar a vida de um inocente é grave (Gn 9.6)."},
 {k:"txt",h:"Conhecido antes de nascer",p:"“Antes que eu te formasse no ventre materno, eu te conheci” (Jr 1.5). João Batista estremeceu no ventre ao ouvir a saudação de Maria (Lc 1.41)."},
 {k:"txt",h:"O que a ciência mostra",p:"Na concepção surge um novo organismo humano, com DNA próprio, distinto do pai e da mãe. Por volta da 6ª semana já se detecta atividade cardíaca."},
 {k:"txt",h:"A pergunta real",p:"Não é se aquilo é vida humana (é). É se **toda** vida humana tem valor."},
 {k:"match",h:"SLED: diferenças que não mudam o valor",pairs:[["Tamanho","criança é menor que adulto"],["Desenvolvimento","menina de 4 anos e mulher de 20"],["Ambiente","20 cm pelo canal de parto"],["Dependência","quem usa insulina não perde direitos"]]},
 {k:"txt",h:"Cristãos sempre foram assim",p:"Em Roma, era comum abandonar bebês indesejados. A Didaqué (séc. I-II) ordenava: “Não matarás a criança por aborto, nem a matarás depois de nascida”. Cristãos resgatavam esses bebês."},
 {k:"txt",h:"Pró-vida de verdade",p:"É defender o bebê **e** cuidar da mãe. É proteger o idoso, o doente e a pessoa com deficiência contra o descarte."},
 {k:"tf",q:"Ser pró-vida é se importar só com o bebê, não com a mãe.",a:false,e:"Pró-vida de verdade cuida dos dois: apoio a gestantes, adoção e ajuda concreta."},
 {k:"chat",who:"Manu",c:"#D9480F",q:"Meu corpo, minhas regras.",o:[
  {t:"Concordo que seu corpo é seu. A questão é se existe outro corpo ali: o bebê tem DNA próprio, coração próprio, às vezes outro sexo. Eu acho que a gente devia cuidar dos dois, da mãe e do filho.",v:2,r:"Nunca tinha visto por esse lado do “outro corpo”.",tip:"Você concordou no que dava, focou na pergunta certa e mostrou cuidado com a mãe."},
  {t:"Isso é assunto de política, não me meto.",v:1,r:"Ué, achei que sua fé falava de vida.",tip:"Ela fala! Dá para conversar sobre isso com argumentos e compaixão."},
  {t:"Quem aborta é assassina e pronto.",v:0,r:"Você nem sabe o que as pessoas passam. 😢",tip:"Fale sempre com graça. Alguém perto de você pode ter passado por isso."}]},
 {k:"txt",h:"Com graça",p:"Para quem já passou por um aborto, a mensagem é Romanos 8.1: “nenhuma condenação há para os que estão em Cristo Jesus”. Há perdão completo."},
 {k:"verse"},
 {k:"mentor",t:"Verdade e graça andam juntas. Defenda a vida e abrace as pessoas."}
 ]},

c3:{conf:"falar sobre identidade e sexualidade com verdade e amor",
 mis:"Faça algo concreto para honrar seu pai, sua mãe ou quem cuida de você esta semana (Êx 20.12).",
 s:[
 {k:"txt",h:"O desenho original",p:"“Homem e mulher os criou” (Gn 1.27). “Os dois se tornam uma só carne” (Gn 2.24). Perguntado sobre casamento, Jesus citou exatamente esses textos (Mt 19.4-6)."},
 {k:"txt",h:"Sexualidade é dádiva",p:"O sexo é bom, criado por Deus, e tem lugar: a aliança do casamento. Seu corpo é “santuário do Espírito Santo” (1 Co 6.19)."},
 {k:"txt",h:"Você não é o seu desejo",p:"A cultura diz: “siga seu coração”. A Bíblia diz que o coração é enganoso (Jr 17.9) e que, em Cristo, você é nova criatura (2 Co 5.17)."},
 {k:"tf",q:"Quem luta com desejos errados não é cristão de verdade.",a:false,e:"Todo cristão luta com desejos que não deve seguir. A luta não define você; Cristo define."},
 {k:"txt",h:"Família: pequenos pelotões",p:"Edmund Burke chamou a família e as comunidades próximas de “pequenos pelotões” da sociedade: é ali que aprendemos a amar, servir e obedecer."},
 {k:"txt",h:"Uma luta real: pornografia",p:"Ela distorce o outro e o sexo, e vicia. A saída: luz (conte a alguém maduro), prestação de contas, filtros e lembrar que a graça é maior que a queda (1 Jo 1.9)."},
 {k:"pick",q:"O que Jesus disse à mulher pega em adultério (Jo 8.11)?",o:["“Nem eu tampouco te condeno; vai e não peques mais.”","“Você está condenada.”","“Faça o que você quiser.”"],c:0,e:"Graça (“não te condeno”) e verdade (“não peques mais”), juntas."},
 {k:"txt",h:"Graça E verdade",p:"Graça sem verdade é bajulação. Verdade sem graça é crueldade. Jesus foi “cheio de graça e de verdade” (Jo 1.14)."},
 {k:"chat",who:"Pedro",c:"#0B7285",q:"Sua igreja é homofóbica por não aceitar casamento gay.",o:[
  {t:"Entendo por que parece isso, e tem cristão que trata mal as pessoas, o que é errado. Mas discordar não é odiar. Creio no casamento como Jesus ensinou em Mateus 19 e creio que todo ser humano tem dignidade. Posso discordar de você e ser seu amigo. Você consegue fazer o mesmo comigo?",v:2,r:"Justo. Assim dá pra conversar.",tip:"Convicção firme, tom manso e amizade de verdade."},
  {t:"Ah, cada um faz o que quer, eu nem ligo.",v:1,r:"Então você acha que sua igreja tá errada?",tip:"Fugir não ajuda. Dá para explicar sua convicção com respeito."},
  {t:"Intolerante é você, que ataca a minha fé.",v:0,r:"Eu só fiz uma pergunta...",tip:"Responder acusação com acusação trava a conversa."}]},
 {k:"mentor",t:"Seja amigo de quem pensa diferente. Firmeza nunca autoriza desprezo, piada ou humilhação."},
 {k:"verse"}
 ]},

c4:{conf:"se posicionar com coragem e respeito na escola e nas redes",
 mis:"Antes de postar ou comentar qualquer coisa nesta semana, passe pelo filtro: é verdade? É necessário? Edifica?",
 s:[
 {k:"txt",h:"De onde vem o nome Apologia",p:"Em 1 Pedro 3.15, “responder” é, em grego, **apologia**: uma defesa racional, como num tribunal. Daí vem o nome deste app."},
 {k:"txt",h:"Preparo e mansidão",p:"Pedro pede as duas coisas. Firmeza não é grosseria."},
 {k:"txt",h:"Seus direitos",p:"A Constituição garante: “é inviolável a liberdade de consciência e de crença” (art. 5º, VI). E ninguém perde direitos por causa da sua crença (art. 5º, VIII)."},
 {k:"tf",q:"Na escola, você é obrigado a esconder a sua fé.",a:false,e:"Você tem o direito de expressar sua fé com respeito (Constituição, art. 5º, VI e VIII)."},
 {k:"txt",h:"Autoridade e limite",p:"O cristão respeita as autoridades (Rm 13.1). Mas, se mandarem negar a Cristo: “antes, importa obedecer a Deus do que aos homens” (At 5.29)."},
 {k:"txt",h:"Como Daniel",p:"Daniel continuou orando com a janela aberta (Dn 6.10). Não desrespeitou o rei, e também não o obedeceu naquilo."},
 {k:"list",h:"Na sala de aula",items:["Seja o aluno mais educado e esforçado da sala","Discordou? Pergunte: “Qual é a fonte disso?”","Não vença a discussão e perca a pessoa"]},

/* ================== v2: MENTORES, FIGURINHAS E MISSÕES ================== */
const trackOf=id=>TRACKS.find(t=>t.mods.includes(id));
const mkOfTrack=t=>MKEYS.find(k=>MENTORS[k].t===t.id);
const trackOfMk=k=>TRACKS.find(t=>t.id===MENTORS[k].t);
function storyDone(id){return!!(S.story[id]&&S.story[id].done)}
function perfect(id){return(S.lessons[id]?.best||0)>=1}
function misDone(id){return!!(S.missions[id]&&S.missions[id].done)}
function lessonPts(id){return(storyDone(id)?1:0)+(passed(id)?1:0)+(perfect(id)?1:0)+(misDone(id)?1:0)}
function mPts(k){return trackOfMk(k).mods.reduce((a,id)=>a+lessonPts(id),0)}
function mStage(k){const p=mPts(k);let s=0;MSTAGE.forEach((v,i)=>{if(p>=v)s=i});return s}
function mVars(k){const M=MENTORS[k];return`--mc1:${M.c1};--mc2:${M.c2};--macc:${M.acc}`}
const art=(k,o)=>mArt(k,mStage(k),o);
const face=k=>mArt(k,mStage(k),{crop:1});
const elx=k=>MENTORS[k].he==="a"?"ela":"ele";
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(“])_(.+?)_(?=[\s.,;:!?)”]|$)/g,"$1<i>$2</i>")}
function fmtDay(k){const[y,m,d]=k.split("-");return d+"/"+m}
function normState(){["story","missions","figSeen","mstage","duelDay"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});S.sp=Object.assign({auto:true,audio:false},S.sp||{});MKEYS.forEach(k=>{if(S.mstage[k]==null)S.mstage[k]=mStage(k)})}
function nextStoryIn(t){return t.mods.find(id=>!storyDone(id))||t.mods.find(id=>!passed(id))||t.mods[0]}
function nextLessonAfter(id){const seq=TRACKS.flatMap(t=>t.mods),i=seq.indexOf(id),n=seq[i+1];return n&&trackUnlocked(trackOf(n))?n:null}

let FIGL=null;
function figList(){if(FIGL)return FIGL;const L=[];let n=0;
 TRACKS.forEach(t=>{t.mods.forEach(id=>FIGS[id].forEach((f,r)=>L.push(Object.assign({},f,{id:id+"-"+r,les:id,r,tr:t.id,no:++n}))));
  const k=mkOfTrack(t),M=MENTORS[k];L.push({id:"L-"+k,leg:k,r:3,tr:t.id,no:++n,n:M.name+", "+M.st[3],c:"Lenda",g:"",d:`Figurinha lendária: ${M.name} chegou ao último estágio. Só aparece para quem leva o tema inteiro a sério.`})});
 return FIGL=L}
function figOwned(f){return f.leg?mStage(f.leg)>=3:f.r===0?storyDone(f.les):f.r===1?passed(f.les):perfect(f.les)}
function figNew(){return figList().filter(f=>figOwned(f)&&!S.figSeen[f.id])}
const FCOND=["Termine os stories da lição","Aprove a prova da lição","Tire nota máxima na prova","Leve o mentor ao estágio 4"];
function figCard(f,o={}){
 const num=String(f.no).padStart(2,"0");
 if(!o.force&&!figOwned(f))return`<div class="fig lock" role="img" aria-label="Figurinha ${num}, ainda não conquistada. ${FCOND[f.r]}."><span class="fig-num">Nº ${num}</span><span class="fig-q" aria-hidden="true">?</span><span class="fig-cond" aria-hidden="true">${FCOND[f.r]}</span></div>`;
 if(!o.force&&!S.figSeen[f.id])return`<button class="fig lock unseen" data-pack="1" aria-label="Figurinha ${num} nova: toque para abrir o pacotinho"><span class="fig-num">Nº ${num}</span><span class="fig-q" aria-hidden="true">!</span><span class="fig-cond" aria-hidden="true">Nova! Toque para colar</span></button>`;
 const col=f.leg?[MENTORS[f.leg].c1,MENTORS[f.leg].c2]:FCAT[f.c],tag=o.tag||"button";
 const g=f.leg?mArt(f.leg,3):`<span class="fig-g${f.g.length>6?" sm":""}">${esc(f.g)}</span>`;
 return`<${tag} class="fig${f.r===2?" shiny":""}${f.leg?" legend":""}" data-fig="${f.id}" style="--f1:${col[0]};--f2:${col[1]}" ${tag==="button"?`aria-label="Figurinha ${num}: ${esc(f.n)}"`:'role="img" aria-label="Figurinha '+num+': '+esc(f.n)+'"'}><span class="fig-top"><span>${f.leg?"Lenda":f.c}</span><span>Nº ${num}</span></span><span class="fig-art">${g}</span><span class="fig-name">${esc(f.n)}</span>${f.y?`<span class="fig-y">${f.y}</span>`:""}</${tag}>`;
}
function modal(html,o={}){
 document.querySelectorAll(".figmodal").forEach(x=>x.remove());
 const d=document.createElement("div");d.className="figmodal";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");if(o.label)d.setAttribute("aria-label",o.label);
 d.innerHTML=`<div class="inner" style="${o.style||""}">${html}</div>`;document.body.appendChild(d);
 const close=()=>{d.remove();document.removeEventListener("keydown",kd);if(o.onClose)o.onClose()};
 const kd=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",kd);
 d.addEventListener("click",e=>{if(e.target===d&&!o.sticky)close()});
 d.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
 d.querySelectorAll("a[href^='#']").forEach(a=>a.addEventListener("click",()=>{d.remove();document.removeEventListener("keydown",kd)}));
 setTimeout(()=>(d.querySelector("[data-focus]")||d.querySelector("button,a"))?.focus(),40);
 return{el:d,close};
}

}

 }
 b.scrollTop=0;b.innerHTML=h;f.innerHTML=foot;bindSlide(s);
 const fr=$("#story .st-frame");if(fr&&!fr.contains(document.activeElement))fr.focus({preventScroll:true});
}

function bindSlide(s){
 const b=$("#stBody"),q=sel=>b.querySelector(sel),id=ST.id;
 const nb=$("#stNext");if(nb)nb.onclick=e=>{e.stopPropagation();next()};
 switch(s.k){
 case"cover":{const tx=$("#stText");if(tx)tx.onclick=()=>{closeStory(false);location.replace("#m-"+id)};break}
 case"slider":{const r=q("#conf"),emo=q("#emo"),val=q("#confv");
  const upd=()=>{const v=+r.value;emo.textContent=v<20?"😰":v<40?"😕":v<60?"😐":v<80?"🙂":"😎";emo.style.left=`calc(${v}% + ${(22-v*.44).toFixed(1)}px)`;emo.style.fontSize=(2.2+v/100*1.1).toFixed(2)+"rem";val.textContent=v+"%"};
  upd();r.oninput=()=>{upd();S.story[id]["c"+s.ph]=+r.value;if(nb)nb.textContent="Continuar"};r.onchange=()=>save();break}
 case"tf":case"pick":case"prova":{
  const isP=s.k==="prova",qq=isP?ST.m.quiz[s.qi]:s,A=isP?ST.prova.ans[s.qi]:ST.ans[ST.i],right=s.k==="tf"?(s.a?1:0):qq.c,st=mStage(ST.mk);
  const reveal=()=>{A.done=true;if(!isP)ST.ans[ST.i].done=true;render();bar(1)};
  b.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{
   if(A.done||(A.pick!=null&&!A.retry))return;const j=+x.dataset.o;A.pick=j;A.ok=j===right;
   if(!isP&&A.ok&&!A.wrongOnce&&once("s"+ST.i))stXP(2,"acerto");
   if(!A.ok)A.wrongOnce=true;
   if(isP&&!A.ok&&st>=2&&!ST.second&&!A.retry){render();return}
   reveal()});
  const hb=q("#hintB");if(hb)hb.onclick=()=>{const w=qq.o.map((_,j)=>j).filter(j=>j!==right&&!A.elim.includes(j));if(!w.length)return;A.elim.push(w[Math.floor(Math.random()*w.length)]);ST.hint=true;A.hint=true;render()};
  const sb=q("#secB");if(sb)sb.onclick=()=>{ST.second=true;A.second=true;A.retry=true;A.elim.push(A.pick);A.pick=null;render()};
  const rb=q("#revB");if(rb)rb.onclick=reveal;break}
 case"order":{const A=ST.ans[ST.i];
  b.querySelectorAll("[data-it]").forEach(x=>x.onclick=()=>{A.pick.push(+x.dataset.it);if(A.pick.length===s.items.length){A.checked=true;A.tries++;A.ok=A.pick.every((p,j)=>p===j);if(A.ok&&A.tries===1&&once("s"+ST.i))stXP(2,"acerto");A.done=true}render();if(A.done)bar(1)});
  b.querySelectorAll("[data-slot]").forEach(x=>x.onclick=()=>{const j=+x.dataset.slot;A.pick.splice(j,1);render()});
  const re=q("#ordRe");if(re)re.onclick=()=>{A.pick=[];A.checked=false;A.ok=false;render()};break}
 case"match":{const A=ST.ans[ST.i];
  const tryPair=()=>{if(A.l==null||A.r==null)return;if(A.l===A.r){A.ok[A.l]=true;A.l=A.r=null;if(Object.keys(A.ok).length===s.pairs.length){A.done=true;if(!A.miss&&once("s"+ST.i))stXP(2,"acerto")}render();if(A.done)bar(1)}
   else{A.miss++;const L=q(`[data-l="${A.l}"]`),R=q(`[data-r="${A.r}"]`);[L,R].forEach(e=>{e.classList.remove("sel");e.classList.add("no","shake")});A.l=A.r=null;later(()=>render(),420)}};
  b.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{A.l=+x.dataset.l;b.querySelectorAll("[data-l]").forEach(e=>e.classList.toggle("sel",e===x));tryPair()});
  b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{A.r=+x.dataset.r;b.querySelectorAll("[data-r]").forEach(e=>e.classList.toggle("sel",e===x));tryPair()});break}
 case"bug":{const A=ST.ans[ST.i];
  b.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{const j=+x.dataset.p;if(j===s.w){A.done=true;if(!A.miss&&once("s"+ST.i))stXP(2,"acerto");render();bar(1)}else{A.miss++;A.tried.push(j);x.classList.add("shake");later(render,380)}});break}
 case"chat":{const A=ST.ans[ST.i];
  if(!A.seen)later(()=>{A.seen=true;render()},900);
  if(A.pick!=null&&!A.reacted)later(()=>{A.reacted=true;A.done=true;render();bar(1)},950);
  b.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{const j=+x.dataset.c;A.pick=j;A.reacted=false;if(s.o[j].v===2&&!A.tried&&once("s"+ST.i))stXP(3,"boa resposta");A.tried=true;render()});
  const re=q("#chatRe");if(re)re.onclick=()=>{A.pick=null;A.reacted=false;render()};
  const v=q(".dm-v");if(v)v.scrollIntoView({block:"end",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});break}
 case"provaRes":{const r=$("#redo");if(r)r.onclick=()=>{ST.prova=null;const i=ST.sl.findIndex(x=>x.k==="provaIntro");ST.sl=ST.sl.slice(0,ST.sl.findIndex(x=>x.k==="provaRes")+1);go(i)};break}
 case"pack":{const pk=q("#pk");if(pk)pk.onclick=()=>{pk.classList.add("open");ST.pack.list.forEach(f=>S.figSeen[f.id]=1);save();later(()=>{ST.pack.open=true;render()},420)};break}
 case"mission":{const g=$("#misGo");if(g)g.onclick=()=>{S.missions[id]={got:today()};save();stChip("Missão aceita!");later(next,700)};
  const d=$("#misDone");if(d)d.onclick=()=>{doneMission(id,"",true);ST.xp+=15;stChip("+15 XP");later(next,800)};break}
 case"end":{const gn=$("#goNext");if(gn)gn.onclick=()=>{const nx=nextLessonAfter(id);closeStory(false);location.replace("#s-"+nx)};
  $("#goText").onclick=()=>{closeStory(false);location.replace("#m-"+id)};$("#stClose2").onclick=()=>closeStory();break}
 }
}

/* ================== ROTAS ================== */
function renderView(h){
 document.querySelectorAll(".figmodal").forEach(x=>x.remove());
 if(h!=="duelo")stopDuelTimer();
 let cur=h;
 if(h.startsWith("m-")){cur="trilha";viewModule(h.slice(2))}
 else if(h==="trilha")viewTrilha();
 else if(h==="cards")viewCards();
 else if(h==="debate")viewDebate();
 else if(h==="duelo"){cur="debate";viewDuelo()}
 else if(h==="livros")viewLivros();
 else if(h==="perfil")viewPerfil();
 else if(h==="album"){cur="inicio";viewAlbum()}
 else if(h==="mentores"){cur="inicio";viewMentores()}
 else if(h.startsWith("mentor-")){cur="inicio";viewMentor(h.slice(7))}
 else{cur="inicio";viewHome()}
 tabs(cur);hdr();
}
function route(){
 const h=(location.hash||"#inicio").slice(1);
 if(h.startsWith("s-")){
  const id=h.slice(2);if(ST&&ST.id===id)return;if(ST)closeStory(false);
  const from=lastNonStory||"#trilha";renderView(from.slice(1));openStory(id,from);return;
 }
 if(ST)closeStory(false);
 lastNonStory="#"+h;renderView(h);
 if(!/^m-/.test(h))maybeEvo();
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{if(location.hash!==lastHash){const was=lastHash;lastHash=location.hash;if(location.hash!=="#debate")DB=null;route();
 if(/^#s-/.test(location.hash))return;
 if(/^#s-/.test(was)&&restoreY!=null&&("#"+(location.hash||"#inicio").slice(1))===lastNonStory){const y=restoreY;restoreY=null;requestAnimationFrame(()=>window.scrollTo(0,y))}else window.scrollTo(0,0)}});
normState();
applyLook();
route();
initSync();initSample();
</script>
